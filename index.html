<style>
  body { min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .cabeza { display: flex; align-items: center; justify-content: space-between; padding: calc(.9rem + env(safe-area-inset-top)) 1.2rem .6rem; }
  .cabeza .marca { text-align: left; }
  .cabeza .marca .aura { font-size: 1.35rem; padding-left: 0; }
  .cabeza .marca .studio { font-size: .5rem; padding-left: 0; }
  .ini { width: 38px; height: 38px; border-radius: 50%; background: var(--lavanda); color: var(--morado-osc); display: grid; place-items: center; font-weight: 800; border: 0; cursor: pointer; }
  main { padding: .4rem 1.2rem 1rem; }
  .saludo { font-family: var(--serif); font-size: 1.9rem; margin: .4rem 0 1rem; line-height: 1.1; }
  .saludo small { display: block; font-family: var(--sans); font-size: .85rem; color: var(--suave); margin-top: .35rem; }
  .saldo { background: linear-gradient(135deg, var(--morado) 0%, #D29AA3 100%); color: #fff; border-radius: 22px; padding: 1.2rem 1.3rem; position: relative; overflow: hidden; }
  .saldo::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .saldo .n { font-family: var(--serif); font-size: 3.2rem; line-height: 1; }
  .saldo .t { font-size: .85rem; opacity: .9; }
  .saldo .v { margin-top: .7rem; font-size: .8rem; opacity: .85; }
  .seccion { margin: 1.5rem 0 .7rem; display: flex; justify-content: space-between; align-items: baseline; }
  .seccion h2 { font-size: 1.35rem; }
  .prox { display: flex; gap: .9rem; align-items: center; }
  .fecha-caja { width: 58px; flex: none; text-align: center; background: var(--lavanda); border-radius: 14px; padding: .45rem 0; color: var(--morado-osc); }
  .fecha-caja .d { font-family: var(--serif); font-size: 1.6rem; line-height: 1; font-weight: 600; }
  .fecha-caja .m { font-size: .65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .prox .info { flex: 1; min-width: 0; }
  .prox .h { font-weight: 800; }
  .prox .s { font-size: .83rem; color: var(--suave); }
  .lista > * + * { margin-top: .7rem; }
  .aviso { border-radius: 16px; padding: .85rem 1rem; font-size: .9rem; margin-bottom: 1rem; }
  .aviso.cumple { background: var(--rosa-claro); color: var(--rosa); }
  .aviso.deuda { background: #F7E4DE; color: var(--alerta); }

  /* Días */
  .dias { display: flex; gap: .5rem; overflow-x: auto; padding: .2rem 1.2rem .8rem; margin: 0 -1.2rem; scrollbar-width: none; }
  .dias::-webkit-scrollbar { display: none; }
  .dia { flex: none; width: 54px; border: 0; border-radius: 16px; background: #fff; padding: .5rem 0; cursor: pointer; box-shadow: var(--sombra); text-align: center; }
  .dia .ds { font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
  .dia .dn { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.1; }
  .dia.activo { background: var(--morado); color: #fff; }
  .dia.activo .ds { color: #F2DDE1; }
  .dia.sin { opacity: .45; }

  /* Clase */
  .clase { background: #fff; border-radius: 18px; padding: 1rem; box-shadow: var(--sombra); }
  .clase.mia { box-shadow: inset 0 0 0 2px var(--morado), var(--sombra); }
  .clase .top { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; }
  .clase .hora { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1; font-variant-numeric: lining-nums; }
  .clase .tipo { font-size: .85rem; color: var(--suave); margin-top: .25rem; }
  .puntos { display: flex; gap: 4px; margin-top: .75rem; }
  .puntos i { width: 100%; height: 6px; border-radius: 6px; background: var(--lavanda); }
  .puntos i.on { background: var(--lila); }
  .puntos i.yo { background: var(--morado); }
  .clase .pie { display: flex; justify-content: space-between; align-items: center; margin-top: .8rem; gap: .6rem; }
  .clase .cupos { font-size: .82rem; color: var(--suave); }
  .quienes { margin-top: .7rem; display: flex; flex-wrap: wrap; gap: .35rem; }
  .quienes span { font-size: .74rem; background: var(--fondo); border-radius: 999px; padding: .2rem .55rem; color: var(--suave); }
  .quienes span.tu { background: var(--lavanda); color: var(--morado-osc); font-weight: 800; }
  .ver-quien { background: none; border: 0; color: var(--morado); font-size: .8rem; font-weight: 700; padding: 0; cursor: pointer; margin-top: .55rem; }

  /* Planes */
  .plan { display: flex; justify-content: space-between; align-items: center; gap: .8rem; }
  .plan .nom { font-weight: 800; }
  .plan .det { font-size: .82rem; color: var(--suave); }
  .plan .pre { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; white-space: nowrap; }
  .barra { height: 8px; border-radius: 8px; background: var(--lavanda); margin-top: .6rem; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--morado); border-radius: 8px; }

  /* Navegación inferior */
  nav.abajo { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--linea); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
  nav.abajo .in { display: flex; width: 100%; max-width: 480px; }
  nav.abajo button { flex: 1; background: none; border: 0; padding: .6rem 0 .55rem; cursor: pointer; color: var(--suave); font-size: .7rem; font-weight: 700; }
  nav.abajo button svg { display: block; margin: 0 auto .15rem; width: 22px; height: 22px; }
  nav.abajo button.activo { color: var(--morado); }

  /* Entrar */
  .entrar { padding: calc(2.5rem + env(safe-area-inset-top)) 1.5rem 2rem; max-width: 420px; margin: 0 auto; }
  .entrar .marca { margin-bottom: 2rem; }
  .logo-hero { display: block; width: 100%; max-width: 300px; aspect-ratio: 1; object-fit: cover; margin: 0 auto 1.6rem; border-radius: 26px; box-shadow: var(--sombra); }
  .pin { letter-spacing: .6em; text-align: center; font-size: 1.3rem; }
  .pin::placeholder { letter-spacing: .15em; font-size: 1rem; }
  .ok-grande { width: 74px; height: 74px; border-radius: 50%; background: var(--lavanda); color: var(--morado); display: grid; place-items: center; margin: .3rem auto 1rem; }
  .modal h3 { font-size: 1.6rem; margin-bottom: .4rem; }
  .modal .sub { color: var(--suave); font-size: .92rem; margin-bottom: 1.1rem; }
  .botones { display: flex; gap: .6rem; margin-top: 1.2rem; }
  .botones .btn { flex: 1; }
  .dato { display: flex; justify-content: space-between; padding: .65rem 0; border-bottom: 1px solid var(--linea); font-size: .92rem; }
  .dato span:first-child { color: var(--suave); }
  .interruptor { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 0; border-bottom: 1px solid var(--linea); }
  .interruptor small { display: block; color: var(--suave); font-size: .8rem; }
  .sw { position: relative; width: 48px; height: 28px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw i { position: absolute; inset: 0; background: var(--piedra); border-radius: 99px; transition: .2s; cursor: pointer; }
  .sw i::before { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + i { background: var(--morado); }
  .sw input:checked + i::before { transform: translateX(20px); }
  .quienes .av { margin-right: -.2rem; border: 2px solid #fff; }
  .quienes span.n { font-size: .74rem; background: var(--fondo); border-radius: 999px; padding: .2rem .55rem .2rem .45rem; color: var(--suave); display: inline-flex; align-items: center; gap: .35rem; }
  .quienes span.n.tu { background: var(--lavanda); color: var(--morado-osc); font-weight: 800; }
  .quienes span.n .av { width: 22px; height: 22px; font-size: .58rem; border: 0; margin: 0; }
  .serie-btn { width: 100%; margin: .2rem 0 1rem; }
  .rapida { background: rgba(255,255,255,.94); border-radius: 20px; box-shadow: var(--sombra); padding: 1rem; margin-bottom: .8rem; }
  .rap-cab { display: flex; gap: .8rem; align-items: center; margin-bottom: .6rem; }
  .rap-n { width: 52px; height: 52px; border-radius: 16px; background: var(--morado); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-size: 1.8rem; font-weight: 600; }
  .rap-s { font-size: .8rem; color: var(--suave); }
  .rap-dia { border-top: 1px solid var(--linea); }
  .rap-dt { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: .7rem .1rem; font: inherit; font-weight: 800; color: var(--tinta); cursor: pointer; }
  .rap-meta { font-size: .76rem; font-weight: 700; color: var(--suave); }
  .rap-meta i { font-style: normal; display: inline-block; transition: transform .15s; margin-left: .2rem; }
  .rap-dia.abierto .rap-meta i { transform: rotate(90deg); }
  .rap-fila { display: flex; align-items: center; gap: .7rem; padding: .55rem .5rem; border-radius: 12px; margin-bottom: .3rem; background: #FAF8F7; }
  .rap-fila.mia { background: var(--lavanda); }
  .rap-h { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; width: 58px; flex: none; font-variant-numeric: lining-nums; }
  .rap-q { flex: 1; min-width: 0; }
  .rap-av { display: flex; }
  .rap-av .av { width: 22px; height: 22px; font-size: .55rem; border: 2px solid #fff; margin-right: -6px; }
  .rap-nom { font-size: .76rem; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .15rem; }
  .rap-cup { font-size: .7rem; color: var(--suave); }
  .prod { display: flex; gap: .9rem; align-items: center; }
  .prod .img { width: 72px; height: 72px; border-radius: 16px; background: var(--lavanda) center/cover; flex: none; display: grid; place-items: center; font-family: var(--serif); font-size: 1.4rem; color: var(--morado); }
  .prod .img.con-foto { color: transparent; }
  .evento { display: flex; gap: .9rem; }
  .perfil-top { display: flex; gap: 1rem; align-items: center; margin: .4rem 0 1rem; }
  .perfil-top .saludo { margin: 0; }
  nav.abajo button { font-size: .66rem; }
  .inst .mini-p { font-size: .82rem; color: var(--suave); margin-top: .15rem; }
  .pasos { margin: .8rem 0 .2rem; padding-left: 1.2rem; font-size: .88rem; line-height: 1.55; }
  .pasos li { margin-bottom: .3rem; }
  .tabs-inst { margin-top: .8rem; font-size: .9rem; }
  .tabs-inst .pasos { margin-top: .3rem; margin-bottom: .7rem; }
</style>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>

<body>
<div id="demo" class="banda-demo oculto">Modo demostración · entra con RUT <b>11.111.111-1</b> y PIN <b>1234</b><button onclick="reiniciar()">Reiniciar</button></div>

<!-- ENTRAR -->
<section id="v-entrar" class="entrar oculto">
  <img class="logo-hero" src="logo.jpg" alt="Aura Studio Pilates by Constanza Hidalgo">
  <form id="f-entrar" autocomplete="on">
    <label class="campo"><span>RUT o correo</span><input class="entrada" name="usuario" autocomplete="username" required placeholder="12.345.678-9"></label>
    <label class="campo"><span>PIN de 4 números</span><input class="entrada pin" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="current-password" required placeholder="••••"></label>
    <button class="btn bloque" type="submit">Entrar</button>
  </form>
  <p style="text-align:center;margin-top:1.4rem">¿Primera vez? <button class="link" onclick="ir('registro')">Crear mi cuenta</button></p>
  <p style="text-align:center;margin-top:.2rem"><button class="link" style="font-weight:600;color:var(--suave)" onclick="olvidePin()">Olvidé mi PIN</button></p>
</section>

<!-- REGISTRO -->
<section id="v-registro" class="entrar oculto">
  <button class="link" onclick="ir('entrar')">← Volver</button>
  <h1 style="font-size:2rem;margin:.6rem 0 .3rem">Crea tu cuenta</h1>
  <p style="color:var(--suave);margin:0 0 1.3rem;font-size:.92rem">Con tu cuenta reservas, cancelas y ves tu plan desde el celular.</p>
  <form id="f-registro">
    <label class="campo"><span>Nombre y apellido</span><input class="entrada" name="nombre" required autocomplete="name"></label>
    <div class="fila2">
      <label class="campo"><span>RUT</span><input class="entrada" name="rut" required placeholder="12.345.678-9"></label>
      <label class="campo"><span>Teléfono</span><input class="entrada" name="telefono" required inputmode="tel" placeholder="9 1234 5678" autocomplete="tel"></label>
    </div>
    <label class="campo"><span>Correo</span><input class="entrada" name="correo" type="email" required autocomplete="email"></label>
    <label class="campo"><span>Cumpleaños (opcional)</span>
      <div class="fila2"><select class="entrada" name="dia"><option value="">Día</option></select><select class="entrada" name="mes"><option value="">Mes</option></select></div>
    </label>
    <div class="fila2">
      <label class="campo"><span>Crea tu PIN</span><input class="entrada pin" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required placeholder="••••" autocomplete="new-password"></label>
      <label class="campo"><span>Repite el PIN</span><input class="entrada pin" name="pin2" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required placeholder="••••" autocomplete="new-password"></label>
    </div>
    <label class="campo"><span>¿Alguna lesión, embarazo o condición que la profe deba saber?</span><textarea class="entrada" name="obs_salud" placeholder="Opcional"></textarea></label>
    <label class="check"><input type="checkbox" name="mostrar" checked><span>Mostrar mi nombre a las compañeras de mi clase</span></label>
    <label class="check"><input type="checkbox" name="consent" required><span>Acepto que Aura guarde estos datos para cuidar mi práctica. Solo los ve la profesora.</span></label>
    <label class="check" id="chk-pol"><input type="checkbox" name="politicas" required><span>Leí y acepto las <button type="button" class="link" style="padding:0" onclick="verPoliticas()">políticas de Aura</button></span></label>
    <button class="btn bloque" type="submit" style="margin-top:.6rem">Crear cuenta</button>
  </form>
</section>

<!-- APP -->
<div id="v-app" class="app oculto">
  <header class="cabeza">
    <div class="marca"><div class="aura">AURA</div><div class="studio">STUDIO PILATES</div></div>
    <button class="ini av" id="ini" onclick="tab('perfil')" style="width:38px;height:38px">A</button>
  </header>
  <main id="contenido"></main>
  <nav class="abajo"><div class="in">
    <button data-tab="inicio" onclick="tab('inicio')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-tab="clases" onclick="tab('clases')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Clases</button>
    <button data-tab="tienda" onclick="tab('tienda')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Tienda</button>
    <button data-tab="plan" onclick="tab('plan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5 14.6 9l5.9.6-4.4 4 1.3 5.9L12 16.6l-5.4 2.9 1.3-5.9-4.4-4L9.4 9z"/></svg>Mi plan</button>
    <button data-tab="perfil" onclick="tab('perfil')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>Perfil</button>
  </div></nav>
</div>
<div id="toast"></div>

<script>
var TK = 'aura_tk', token = localStorage.getItem(TK) || '';
var pub = null, yo = null, diaSel = null, cacheClases = null, tabActual = null;
AuraNav.mostrar = function (e) {
  if (!token) return ir(e.vista === 'registro' ? 'registro' : 'entrar', true);
  if (!yo) return;
  if ($('#v-app').classList.contains('oculto')) ir('app', true);
  tab(e.tab || 'inicio', true);
};
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
var DIAS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var $ = function (s) { return document.querySelector(s); };
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function plata(n) { return '$' + Number(n).toLocaleString('es-CL'); }
function dObj(f) { var p = f.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function fLarga(f) { var d = dObj(f); return DIAS_L[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESES_L[d.getUTCMonth()]; }
function mayus(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function fCorta(f) { var d = dObj(f); return d.getUTCDate() + ' ' + MESES[d.getUTCMonth()]; }
function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.add('ver'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('ver'); }, 3200); }
function api(a, args) {
  return Aura.llamar(a, args, token).catch(function (e) {
    if (e.codigo === 'sesion') { salir(); }
    toast(e.mensaje || 'Algo salió mal'); throw e;
  });
}
function modal(html) {
  var previa = $('#velo'); if (previa) previa.remove(); else AuraNav.modalAbierto();
  var v = document.createElement('div'); v.className = 'velo'; v.id = 'velo';
  v.innerHTML = '<div class="modal">' + html + '</div>';
  v.addEventListener('click', function (e) { if (e.target === v) cerrarModal(); });
  document.body.appendChild(v);
}
function cerrarModal() { var v = $('#velo'); if (v) { v.remove(); AuraNav.modalCerrado(); } }
function ws(texto) { return 'https://wa.me/' + (pub && pub.whatsapp || '') + '?text=' + encodeURIComponent(texto); }

/* ---------- Vistas ---------- */
function ir(v, sinHist) {
  if (!sinHist) { if (v === 'registro') AuraNav.ir({ vista: 'registro' }); else AuraNav.base({ vista: v }); }
  ['entrar', 'registro', 'app'].forEach(function (x) { $('#v-' + x).classList.toggle('oculto', x !== v); });
  window.scrollTo(0, 0);
}
function salir() { token = ''; localStorage.removeItem(TK); yo = null; ir('entrar'); }
function reiniciar() { Aura.reiniciarDemo(); salir(); toast('Demo reiniciada'); }
function olvidePin() {
  if (pub && pub.whatsapp) location.href = ws('Hola, olvidé mi PIN de la app de Aura. Mi nombre es ');
  else toast('Pídele a Constanza que te asigne un PIN nuevo.');
}

$('#f-entrar').addEventListener('submit', function (e) {
  e.preventDefault(); var f = e.target, b = f.querySelector('button'); b.disabled = true;
  Aura.llamar('entrar', { usuario: f.usuario.value, pin: f.pin.value }).then(function (r) {
    token = r.token; localStorage.setItem(TK, token); f.pin.value = ''; empezar();
  }).catch(function (e) { toast(e.mensaje); }).then(function () { b.disabled = false; });
});

(function () {
  var f = $('#f-registro');
  for (var i = 1; i <= 31; i++) f.dia.insertAdjacentHTML('beforeend', '<option>' + i + '</option>');
  MESES_L.forEach(function (m, i) { f.mes.insertAdjacentHTML('beforeend', '<option value="' + (i + 1) + '">' + m + '</option>'); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (f.pin.value !== f.pin2.value) return toast('Los PIN no coinciden');

  if (!vig.length) h += '<div class="tarjeta vacio">No tienes un plan activo.</div>';
  vig.forEach(function (p) {
    h += '<div class="tarjeta"><div class="plan"><div><div class="nom">' + esc(p.nombre) + '</div><div class="det">' + (p.vence ? 'Vence el ' + fLarga(p.vence) : 'Sin vencimiento') + '</div></div>' +
      '<div style="text-align:right"><div class="pre">' + p.libres + '/' + p.total + '</div><div class="det">' + (p.libres ? 'disponibles' : 'agotado') + '</div></div></div>' +
      '<div class="barra"><i style="width:' + Math.round(p.libres / p.total * 100) + '%"></i></div></div>';
  });
  h += '</div><button class="btn claro bloque" style="margin-top:.9rem" onclick="tab(\'tienda\')">Comprar o renovar pack</button>';
  var hist = yo.historial.filter(function (r) { return r.estado !== 'cancelada'; }).slice(0, 8);
  if (hist.length) {
    var EST = { 'asistió': 'Asististe', 'faltó': 'No asististe', 'tardía': 'Cancelada tarde', 'reservada': 'Reservada' };
    h += '<div class="seccion"><h2>Últimas clases</h2></div><div class="tarjeta">' + hist.map(function (r) {
      return '<div class="dato"><span>' + fCorta(r.fecha) + ' · ' + r.inicio + '</span><b style="font-weight:700">' + (EST[r.estado] || r.estado) + '</b></div>';
    }).join('') + '</div>';
  }
  $('#contenido').innerHTML = h;
}
function loQuiero(id) {
  var p = pub.planes.filter(function (x) { return x.id === id; })[0];
  modal('<h3>' + esc(p.nombre) + '</h3><p class="sub">' + p.clases + (p.clases === 1 ? ' clase' : ' clases') + ' · ' + (p.dias ? p.dias + ' días' : 'sin vencimiento') + ' · <b>' + plata(p.precio) + '</b></p>' +
    (pub.transferencia ? '<div class="tarjeta" style="box-shadow:none;background:var(--fondo);font-size:.9rem;white-space:pre-line"><b>Datos de transferencia</b>\n' + esc(pub.transferencia) + '</div>' : '') +
    '<p style="font-size:.88rem;color:var(--suave)">Transfiere y mándanos el comprobante por WhatsApp. Constanza activa tu plan y lo ves aquí al tiro.</p>' +
    '<a class="btn ws bloque" target="_blank" href="' + ws('Hola Constanza, quiero el plan ' + p.nombre + ' (' + plata(p.precio) + '). Soy ' + yo.perfil.nombre + '.') + '">Escribir por WhatsApp</a>');
}

/* ---------- TIENDA ---------- */
function vTienda() {
  var h = '<h1 class="saludo" style="font-size:1.7rem">Tienda<small>Packs de clases y accesorios. Pides por WhatsApp y pagas por transferencia.</small></h1>';
  h += '<div class="seccion" style="margin-top:.4rem"><h2>Packs de clases</h2></div><div class="lista">';
  pub.planes.forEach(function (p) {
    h += '<div class="tarjeta"><div class="plan"><div><div class="nom">' + esc(p.nombre) + '</div><div class="det">' + (p.clases === 1 ? (p.dias ? '1 clase' : 'Clase suelta') : p.clases + ' clases al mes') +
      (p.dias === 30 && p.clases % 4 === 0 ? ' · ' + (p.clases / 4) + (p.clases === 4 ? ' vez' : ' veces') + ' por semana' : ' · ' + (p.dias ? 'para usar en ' + p.dias + ' días' : 'sin vencimiento')) + '</div></div><div class="pre">' + plata(p.precio) + '</div></div>' +
      '<button class="btn claro bloque peq" style="margin-top:.8rem" onclick="loQuiero(\'' + p.id + '\')">Lo quiero</button></div>';
  });
  h += '</div>';
  if (pub.productos && pub.productos.length) {
    h += '<div class="seccion"><h2>Accesorios</h2></div><div class="lista">';
    pub.productos.forEach(function (p) {
      var agotado = p.stock !== null && p.stock <= 0;
      h += '<div class="tarjeta prod"><span class="img" data-foto="' + esc(p.foto) + '">' + esc(p.nombre.charAt(0)) + '</span><div style="flex:1;min-width:0"><div style="font-weight:800">' + esc(p.nombre) + '</div>' +
        '<div style="font-size:.82rem;color:var(--suave)">' + esc(p.descripcion) + '</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:.4rem"><span class="pre" style="font-family:var(--serif);font-size:1.2rem;font-weight:600">' + plata(p.precio) + '</span>' +
        (agotado ? '<span class="chip gris">Agotado</span>' : '<a class="btn claro peq" target="_blank" href="' + ws('Hola Constanza, quiero ' + p.nombre + ' (' + plata(p.precio) + '). Soy ' + yo.perfil.nombre + '.') + '">Lo quiero</a>') + '</div></div></div>';
    });
    h += '</div>';
  }
  $('#contenido').innerHTML = h; Aura.pintarFotos($('#contenido'), token);
}

/* ---------- PERFIL ---------- */
function vPerfil() {
  var p = yo.perfil;
  $('#contenido').innerHTML = '<div class="perfil-top"><label class="foto-sub" title="Cambiar foto"><span class="av g" data-foto="' + esc(p.foto) + '">' + iniciales(p.nombre) + '</span><span class="lapiz">✎</span>' +
    '<input type="file" accept="image/*" onchange="subirMiFoto(this)"></label><h1 class="saludo" style="font-size:1.6rem">' + esc(p.nombre) + '<small>' + esc(p.correo) + '</small></h1></div>' +
    '<div class="tarjeta"><div class="dato"><span>RUT</span><b>' + esc(p.rut) + '</b></div><div class="dato"><span>Teléfono</span><b>' + esc(p.telefono) + '</b></div>' +
    '<div class="dato" style="border:0"><span>Cumpleaños</span><b>' + (p.fecha_nacimiento ? esc(p.fecha_nacimiento.split('-')[0] + ' de ' + MESES_L[+p.fecha_nacimiento.split('-')[1] - 1]) : '—') + '</b></div></div>' +
    '<div class="tarjeta" style="margin-top:.8rem"><div class="interruptor" style="padding-top:0"><div>Mostrar mi nombre<small>Tus compañeras ven tu nombre en la lista de la clase</small></div>' +
    '<label class="sw"><input type="checkbox" id="sw-nombre"' + (p.mostrar_nombre ? ' checked' : '') + '><i></i></label></div>' +
    '<label class="campo" style="margin:.9rem 0 .4rem"><span>Salud (solo lo ve la profesora)</span><textarea class="entrada" id="salud">' + esc(p.obs_salud || '') + '</textarea></label>' +
    '<button class="btn claro peq" onclick="guardarSalud()">Guardar</button></div>' +
    '<div class="tarjeta" style="margin-top:.8rem"><b>Cambiar PIN</b><div class="fila2" style="margin-top:.7rem"><input class="entrada pin" id="pa" type="password" inputmode="numeric" maxlength="4" placeholder="Actual"><input class="entrada pin" id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="Nuevo"></div>' +
    '<button class="btn claro peq" style="margin-top:.7rem" onclick="cambiarPin()">Cambiar PIN</button></div>' +
    tarjetaInstalar() +
    '<button class="btn claro bloque" style="margin-top:1rem" onclick="verPoliticas()">Políticas de Aura</button>' +
    (pub.whatsapp ? '<a class="btn ws bloque" style="margin-top:.7rem" target="_blank" href="' + ws('Hola Constanza, ') + '">Escribir a Aura por WhatsApp</a>' : '') +
    (pub.soporte ? '<a class="btn borde bloque" style="margin-top:.7rem" target="_blank" href="https://wa.me/' + pub.soporte + '?text=' + encodeURIComponent('Hola, tengo un problema con la app de Aura: ') + '">¿Problemas con la app? Soporte</a>' : '') +
    '<button class="btn borde bloque" style="margin-top:.7rem" onclick="salir()">Cerrar sesión</button>' +
    '<p style="text-align:center;font-size:.75rem;color:var(--suave);margin-top:1.5rem">Aura Studio Pilates · Illapel</p>';
  Aura.pintarFotos($('#contenido'), token);
  $('#sw-nombre').addEventListener('change', function (e) {
    api('guardarPerfil', { mostrar_nombre: e.target.checked }).then(function (r) { yo.perfil = r.perfil; toast(e.target.checked ? 'Tu nombre se muestra' : 'Tu nombre queda oculto'); });
  });
}
/* ---------- Instalar como app ---------- */
var promptInstalar = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptInstalar = e; var b = $('#b-instalar'); if (b) b.classList.remove('oculto'); });
window.addEventListener('appinstalled', function () { toast('¡Listo! Aura quedó en tu pantalla de inicio'); });
function yaInstalada() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function tarjetaInstalar() {
  if (yaInstalada()) return '<div class="tarjeta inst" style="margin-top:.8rem"><b>✓ Ya tienes Aura como app</b><div class="mini-p">La abres desde el ícono en tu pantalla de inicio.</div></div>';
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var iosOtro = ios && /CriOS|FxiOS|EdgiOS|Instagram|FBAN|FBAV/.test(ua);
  var compartir = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  var mas = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
  var pasosIos = '<ol class="pasos"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> ' + compartir + ' (abajo al centro, o arriba en iPad).</li>' +
    '<li>Baja y toca <b>Agregar a inicio</b> ' + mas + '.</li><li>Toca <b>Agregar</b>. El ícono de Aura queda en tu pantalla.</li></ol>';
  var pasosAndroid = '<ol class="pasos"><li>Abre esta página en <b>Chrome</b>.</li><li>Toca el menú <b>⋮</b> (arriba a la derecha).</li>' +
    '<li>Toca <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</li><li>Confirma. El ícono de Aura queda junto a tus apps.</li></ol>';
  return '<div class="tarjeta inst" style="margin-top:.8rem"><div style="display:flex;gap:.8rem;align-items:center"><img src="icon-192.png" alt="" style="width:52px;height:52px;border-radius:14px;box-shadow:var(--sombra)">' +
    '<div><b>Ten Aura como app en tu celular</b><div class="mini-p">Se abre a pantalla completa, sin buscar el link, y entras directo.</div></div></div>' +
    '<button id="b-instalar" class="btn bloque' + (promptInstalar ? '' : ' oculto') + '" style="margin-top:.9rem" onclick="instalarApp()">Instalar app</button>' +
    (iosOtro ? '<div class="aviso deuda" style="margin:.9rem 0 0">En iPhone se instala solo desde <b>Safari</b>. Copia el link y ábrelo ahí.</div>' : '') +
    (ios ? pasosIos : '<div class="tabs-inst"><b>Android</b>' + pasosAndroid + '<b>iPhone</b>' + pasosIos + '</div>') + '</div>';
}
function instalarApp() {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  promptInstalar.userChoice.then(function () { promptInstalar = null; var b = $('#b-instalar'); if (b) b.classList.add('oculto'); });
}
function subirMiFoto(input) {
  var f = input.files[0]; if (!f) return;
  Aura.achicarFoto(f, 200).then(function (data) { return api('subirFoto', { data: data }); })
    .then(function () { sessionStorage.removeItem('aura_fotos'); toast('Foto actualizada'); return cargarYo(); }).then(vPerfil)
    .catch(function (e) { if (e && e.mensaje) toast(e.mensaje); });
}
function guardarSalud() { api('guardarPerfil', { obs_salud: $('#salud').value }).then(function (r) { yo.perfil = r.perfil; toast('Guardado'); }); }
function cambiarPin() {
  api('guardarPerfil', { pin_actual: $('#pa').value, pin_nuevo: $('#pn').value }).then(function () { $('#pa').value = $('#pn').value = ''; toast('PIN cambiado'); });
}

/* ---------- Arranque ---------- */
function refrescarPub() { return Aura.llamar('publico').then(function (r) { pub = r; }); }
if (Aura.demo) $('#demo').classList.remove('oculto');
refrescarPub().then(function () {
  if (!pub.politicas) { $('#chk-pol').remove(); }
  if (token) empezar(); else ir('entrar');
}).catch(function () { ir('entrar'); toast('No pudimos conectar con el servidor'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
